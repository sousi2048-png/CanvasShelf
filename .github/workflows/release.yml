name: Build CanvasShelf desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Verify Python code
        env:
          PYTHONPATH: ..
        run: |
          uv python install 3.12
          uv run --no-project --python 3.12 python -m unittest discover -s tests -v
          uv run --no-project --python 3.12 python -m py_compile server.py sync_gallery_collections.py
          node --check gallery/app.js

  build:
    name: Build ${{ matrix.target }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows
          - runner: macos-15-intel
            target: macos-intel
          - runner: macos-15
            target: macos-apple-silicon
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Build Windows package
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - name: Build macOS package
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: ./packaging/build_macos.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: CanvasShelf-${{ matrix.target }}
          path: release/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: CanvasShelf-*
          path: release
          merge-multiple: true

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
